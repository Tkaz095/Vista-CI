assumptions:
  - id: unsigned-multipart-contract
    status: supported
    claim: The upload endpoint accepts multipart file and upload_preset; API secret is not required for an unsigned preset.
    reason: Official Cloudinary Upload API documents this contract. The real Dart adapter serialized these fields over loopback HTTP.
    verification: On 2026-11-05, read provider docs and ran ci_report_test.dart. Loopback server captured PDF file, preset and public_id with no Authorization or API secret. Simulation served POST /v1_1/demo/raw/upload with HTTP 200.
    source: https://cloudinary.com/documentation/image_upload_api_reference#unsigned_upload_multipart_form_structure; mobile/test/ci_report_test.dart; postman/specs/cloudinary-report-upload.yaml
    updated_at: '2026-11-05'
  - id: provider-errors-retain-local-pdf
    status: supported
    claim: In the modeled 400, 429, 500 and malformed-JSON scenarios the caller rejects upload and retains a previously generated PDF in its ViewModel.
    reason: Real HTTP tests exercise the adapter; ViewModel tests verify retained PDF and manual retry after failure.
    verification: On 2026-11-05, all 18 report tests passed with CLOUDINARY_SIMULATION_BASE=http://127.0.0.1:4513. Simulation log contained demo=200, rejected=400, limited=429, unavailable=500 and invalid-json=200 requests from the real Dart client.
    source: mobile/test/ci_report_test.dart; postman/mocks/cloudinary/default.js; docs/ci-report-cloudinary.md
    updated_at: '2026-11-05'
  - id: live-account-preset-and-pdf-delivery
    status: unknown
    claim: The user's Cloudinary environment accepts this preset and serves uploaded PDF URLs.
    reason: No cloud name or preset was provided and no real Cloudinary upload was performed. User will configure public identifiers in Firebase Remote Config. CLI signed out, so owner mock discovery was skipped; local stand-in came from official docs, not a published provider mock.
    verification: Requires one live upload and opening secure_url after configuring the unsigned preset and enabling PDF delivery on the Cloudinary account.
    source: docs/ci-report-cloudinary.md; https://cloudinary.com/documentation/pdf_optimization
    updated_at: '2026-11-05' 

