name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Android target (x64 for most Genymotion Desktop devices)'
        type: choice
        required: true
        default: android-x64
        options:
          - android-x64
          - android-arm64
          - all

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_PLATFORM: ${{ inputs.target || 'android-x64' }}
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Firebase Android configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('android/app/google-services.json')
          if not path.is_file():
              raise SystemExit('Missing mobile/android/app/google-services.json. Include the Firebase Android client config in this commit.')
          config = json.loads(path.read_text())
          packages = [client['client_info']['android_client_info']['package_name'] for client in config.get('client', [])]
          if 'com.vista.vista_mobile' not in packages:
              raise SystemExit('Firebase Android package must match com.vista.vista_mobile.')
          if config.get('project_info', {}).get('project_id') != 'vista-ci':
              raise SystemExit('Expected Firebase project vista-ci.')
          print('Firebase Android configuration matches Vista CI.')
          PY

      - name: Set up Java and Gradle cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties
            mobile/pubspec.lock

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Reuse development signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: vista-ci-debug-keystore-${{ runner.os }}-v1

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Build installable development APK
        run: |
          case "$TARGET_PLATFORM" in
            android-x64|android-arm64)
              flutter build apk --debug --no-pub --target-platform "$TARGET_PLATFORM"
              ;;
            all)
              flutter build apk --debug --no-pub
              ;;
            *)
              printf 'Unsupported Android target: %s\n' "$TARGET_PLATFORM" >&2
              exit 1
              ;;
          esac
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk "../artifacts/vista-ci-debug-${TARGET_PLATFORM}.apk"

      - name: Upload APK for Genymotion
        id: apk
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/vista-ci-debug-${{ env.TARGET_PLATFORM }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Write download instructions
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          {
            printf '## Vista CI Android APK\n\n'
            printf '[Download the APK](%s)\n\n' "$APK_URL"
            printf 'Target: `%s` · Commit: `%s`\n\n' "$TARGET_PLATFORM" "$SOURCE_COMMIT"
            printf 'Drag the downloaded APK into your running Genymotion device to install it.\n'
          } >> "$GITHUB_STEP_SUMMARY"
