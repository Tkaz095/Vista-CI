name: Firebase backend and web

on:
  push:
    branches: [main, dev]
    paths: ['functions/**', 'web/**', 'firebase.json', '.github/workflows/backend-check.yml']
  pull_request:
    paths: ['functions/**', 'web/**', 'firebase.json', '.github/workflows/backend-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run lint
        working-directory: web
